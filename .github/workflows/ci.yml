name: CI
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run release quality gate
        run: TMPDIR=/tmp npm run verify:release
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs-node-${{ matrix.node }}
          path: |
            dist/
            vscode-extension/dist/
            vscode-extension/out/
          if-no-files-found: ignore

  browser-e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - run: npm run test:e2e:install
      - name: Run browser E2E
        run: xvfb-run -a env TMPDIR=/tmp E2E_HEADLESS=0 npm run test:e2e -- --project=browser-extension
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
