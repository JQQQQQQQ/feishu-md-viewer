name: 功能建议
description: 提议一个能改善 Markdown 阅读或预览体验的功能
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请优先描述实际使用场景和要解决的问题，避免只描述实现方式。

  - type: textarea
    id: background
    attributes:
      label: 问题背景
      description: 当前遇到什么限制？谁会受到影响？
      placeholder: 例如：长文档中需要快速定位重复出现的关键词
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望方案
      description: 你希望产品如何表现？可以附上交互示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 你尝试过哪些替代方案？为什么不够好？

  - type: dropdown
    id: runtime
    attributes:
      label: 适用环境
      options:
        - Chrome 浏览器扩展
        - VS Code 扩展
        - Chrome 和 VS Code 都需要
        - 不确定
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: 示例或参考
      description: 可以提供示例 Markdown、截图、参考产品或相关链接。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复建议。
          required: true
