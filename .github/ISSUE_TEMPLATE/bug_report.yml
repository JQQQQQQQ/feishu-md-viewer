name: Bug 反馈
description: 报告一个可以复现的问题，帮助我们定位和修复
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题。请尽量提供完整的运行环境、复现步骤和截图。

  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 用一句话说明发生了什么。
      placeholder: 例如：VS Code 切换选项卡后目录闪动并保持隐藏
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: 运行环境
      options:
        - Chrome 浏览器扩展
        - VS Code 扩展
        - Chrome 和 VS Code 都有
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 浏览器、VS Code 和扩展版本
      description: 请填写可以帮助复现的版本信息。
      placeholder: 例如：Chrome 138 / VS Code 1.103 / Feishu Viewer v0.1.1
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Markdown 文件来源
      options:
        - 本地 file:// 文件
        - GitHub
        - GitLab
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按实际操作顺序列出最小复现步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 拖动……
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 描述当前看到的结果，必要时附上控制台错误。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 描述你期望的行为。
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 截图、录屏或测试文件
      description: 可以拖入截图、录屏、最小 Markdown 示例或相关日志。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认使用的是最新发布版本。
          required: true
        - label: 我已搜索现有 Issue，确认没有重复问题。
          required: true
